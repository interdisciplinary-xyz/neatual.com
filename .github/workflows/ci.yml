name: CI

# There was no .github directory at all: nothing ran lint, nothing ran a
# production build, and nothing ever booted the built server. Three findings in
# docs/audits/2026-08-10-security-dependency-audit.md were visible in `pnpm
# build` output or in the booted app, and no automated run ever looked.
#
# `scope/**` is deliberately absent from the push triggers. Those branches
# always reach a release through a PR, and listing them here fired both the
# push and the pull_request event for the same commit — every job ran twice and
# PR #2 showed 6 checks for 3 failures. A concurrency group cannot fix that on
# its own: the two events produce different group keys, so neither cancels the
# other. Scope branches are still covered, once, by the pull_request trigger.
on:
  push:
    branches: [master, "release/**"]
  pull_request:

# Supersede in-flight runs when a branch is pushed again mid-run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Now carries react, react-hooks and jsx-a11y. Before this the config
      # extended eslint:recommended alone and passed while the site shipped
      # `<li role="button">` and click-only list items.
      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm test

      - run: pnpm build

      - name: Assert build artifacts exist
        run: |
          test -f build/server/index.js
          test -d build/client/assets

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Gated against a recorded baseline rather than `--audit-level high`.
      # The four open advisories are all React Router, all patched only in
      # 7.18.0, which Remix 2 cannot use — so an absolute gate would be
      # permanently red, get disabled, and leave nothing checking dependencies
      # at all. This fails on anything NEW at any severity.
      - run: pnpm audit:check

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Nothing would have caught a committed credential. The repo has no
      # secrets today — no env reads outside NODE_ENV — but it grew a
      # .env.example and a CMS token surface in the same week this was written.
      # `--fail` is NOT passed here: the action already appends it, and
      # trufflehog rejects a repeated flag ("flag 'fail' cannot be repeated"),
      # which failed the job for a config error rather than a finding.
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified

  performance:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Three URLs, not just `/`, and median-aggregated — see lighthouserc.cjs.
      # Widening past the homepage is not cosmetic: it immediately surfaced two
      # defects on /kontakt that the original audit missed by measuring only
      # `/` and `/galeria`.
      - run: pnpm test:performance

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14

  smoke:
    name: Production boot smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # The point of this job. `express` and the since-retired `cross-env` used
      # to sit in devDependencies while `pnpm start` needed both at runtime, so
      # a pruned production install booted straight into ERR_MODULE_NOT_FOUND.
      # Nothing would have caught that except starting the server the way a
      # host does.
      - name: Prune to production dependencies
        run: pnpm install --prod --frozen-lockfile --ignore-scripts

      - name: Boot the server
        run: |
          PORT=7878 NODE_ENV=production node ./server.js &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null "http://localhost:7878/" && break
            sleep 1
          done

      - name: Assert every route responds
        run: |
          set -e
          for path in / /galeria /kontakt /en /en/gallery /en/contact /de /de/galerie /de/kontakte /sitemap.xml /robots.txt; do
            code=$(curl -s -o /dev/null --retry 3 --retry-connrefused --retry-delay 1 -w '%{http_code}' "http://localhost:7878$path")
            echo "$code  $path"
            [ "$code" = "200" ] || exit 1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:7878/no-such-page")
          echo "$code  /no-such-page"
          [ "$code" = "404" ] || exit 1

      - name: Assert responses are compressed and headers are set
        run: |
          set -e
          headers=$(curl -s -D - -o /dev/null -H 'Accept-Encoding: gzip, br' "http://localhost:7878/galeria")
          echo "$headers"
          echo "$headers" | grep -qi '^content-encoding:' || { echo 'no compression'; exit 1; }
          echo "$headers" | grep -qi '^x-content-type-options: nosniff' || exit 1
          echo "$headers" | grep -qi '^content-security-policy:' || exit 1
          echo "$headers" | grep -qi '^x-powered-by:' && { echo 'x-powered-by leaked'; exit 1; }
          exit 0

      # `curl -sf --retry` and a separate exit-code check, so a dropped
      # connection is reported as a failed request rather than silently
      # counting as "this page has no h1" — which is how /de failed this step
      # once while serving a correct h1 on 40/40 requests locally.
      - name: Assert every page has exactly one h1
        run: |
          set -e
          for path in / /galeria /kontakt /en /en/gallery /en/contact /de /de/galerie /de/kontakte; do
            body=$(curl -sf --retry 3 --retry-connrefused --retry-delay 1 "http://localhost:7878$path") \
              || { echo "request failed: $path"; exit 1; }
            n=$(printf '%s' "$body" | grep -o '<h1' | wc -l | tr -d ' ')
            echo "h1=$n  $path"
            [ "$n" = "1" ] || { echo "expected exactly one h1 on $path"; exit 1; }
          done
